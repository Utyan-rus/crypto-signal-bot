name: Hourly candidate research

on:
  pull_request:
    paths:
      - "backtest.py"
      - "hourly_candidate_research.py"
      - "tests/test_hourly_candidate_research.py"
      - ".github/workflows/hourly-candidate-research.yml"
  workflow_dispatch:
    inputs:
      max_markets:
        description: "Markets to test"
        required: true
        default: "5"
        type: choice
        options: ["5", "10", "25"]

permissions:
  contents: read

jobs:
  hourly-research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Test hourly research
        run: python -m unittest discover -s tests -p 'test_hourly_candidate_research.py' -v
      - name: Run 180-day hourly out-of-sample research
        run: python hourly_candidate_research.py --days 180 --max-markets "${{ inputs.max_markets || '5' }}" --out hourly-candidate-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighter-hourly-candidates
          path: hourly-candidate-results/
          if-no-files-found: warn
          retention-days: 30
