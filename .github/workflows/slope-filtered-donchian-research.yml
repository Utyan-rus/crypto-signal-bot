name: EMA200-slope Donchian paired paper research

on:
  pull_request:
    paths:
      - "slope_filtered_donchian_research.py"
      - "slope_filter_bootstrap_audit.py"
      - "tests/test_slope_filtered_donchian_research.py"
      - "tests/test_slope_filter_bootstrap_audit.py"
      - ".github/workflows/slope-filtered-donchian-research.yml"
  workflow_dispatch:
    inputs:
      max_markets:
        description: "Predeclared crypto-major cohort size"
        required: true
        default: "10"
        type: choice
        options: ["5", "10"]

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile and regression tests
        run: |
          python -m compileall -q slope_filtered_donchian_research.py slope_filter_bootstrap_audit.py
          python -m unittest discover -s tests -p 'test_slope_filtered_donchian_research.py' -v
          python -m unittest discover -s tests -p 'test_slope_filter_bootstrap_audit.py' -v
      - name: Run fixed 400-day funding-aware paired study
        run: |
          END_TS=$(date -u +%s)
          python slope_filtered_donchian_research.py --days 400 --windows 12 --window-days 30 --max-markets "${{ inputs.max_markets || '10' }}" --balances 5,50,100 --end-timestamp "$END_TS" --out slope-filtered-donchian-results
      - name: Quantify paired candidate-minus-baseline uncertainty
        run: |
          python slope_filter_bootstrap_audit.py --input slope-filtered-donchian-results/slope_filter_pairs.csv --metadata slope-filtered-donchian-results/run_metadata.json --out slope-filtered-donchian-results/slope_filter_bootstrap_summary.csv --market-out slope-filtered-donchian-results/slope_filter_leave_one_market_out.csv --window-out slope-filtered-donchian-results/slope_filter_window_detail.csv --replicates 10000 --block-length 2 --seed 20261031
      - name: Upload research results and audit tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighter-slope-filtered-donchian-research
          path: slope-filtered-donchian-results/
          if-no-files-found: warn
          retention-days: 30
