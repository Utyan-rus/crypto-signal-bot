name: 365-day fixed-parameter hourly walk-forward research

on:
  pull_request:
    paths:
      - "walk_forward_research.py"
      - "hourly_candidate_research.py"
      - "tests/test_walk_forward_research.py"
      - ".github/workflows/walk-forward-research.yml"
  workflow_dispatch:
    inputs:
      max_markets:
        description: "Markets to test"
        required: true
        default: "5"
        type: choice
        options: ["5", "10", "25"]

permissions:
  contents: read

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_walk_forward_research.py' -v
      - name: Run 365-day history with eight OOS windows
        run: python walk_forward_research.py --days 365 --max-markets "${{ inputs.max_markets || '5' }}" --out walk-forward-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighter-hourly-walk-forward
          path: walk-forward-results/
          if-no-files-found: warn
          retention-days: 30
