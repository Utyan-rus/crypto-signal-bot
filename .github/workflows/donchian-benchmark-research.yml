name: Paired Donchian benchmark research

on:
  pull_request:
    paths:
      - "donchian_benchmark_research.py"
      - "paired_bootstrap_audit.py"
      - "two_way_bootstrap_audit.py"
      - "funding_aware_research.py"
      - "hourly_candidate_research.py"
      - "tests/test_donchian_benchmark_research.py"
      - "tests/test_paired_bootstrap_audit.py"
      - "tests/test_two_way_bootstrap_audit.py"
      - ".github/workflows/donchian-benchmark-research.yml"
  workflow_dispatch:
    inputs:
      cohort:
        description: "Predeclared research cohort"
        required: true
        default: "majors10"
        type: choice
        options: ["majors10", "full_crypto"]

permissions:
  contents: read

jobs:
  paired-donchian-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile and unit tests
        run: |
          python -m compileall -q donchian_benchmark_research.py paired_bootstrap_audit.py two_way_bootstrap_audit.py funding_aware_research.py hourly_candidate_research.py
          python -m unittest discover -s tests -p 'test_donchian_benchmark_research.py' -v
          python -m unittest discover -s tests -p 'test_paired_bootstrap_audit.py' -v
          python -m unittest discover -s tests -p 'test_two_way_bootstrap_audit.py' -v
      - name: Run paired 360-day OOS Donchian vs buy-and-hold on predeclared cohort
        run: |
          END_TS=$(date -u +%s)
          COHORT="${{ inputs.cohort || 'majors10' }}"
          if [ "$COHORT" = "majors10" ]; then
            python donchian_benchmark_research.py --days 400 --windows 12 --window-days 30 --max-markets 100 --symbols "BTC,ETH,SOL,BNB,XRP,DOGE,ADA,AVAX,LINK,LTC" --balances 5,50,100 --end-timestamp "$END_TS" --out donchian-benchmark-results
          elif [ "$COHORT" = "full_crypto" ]; then
            python donchian_benchmark_research.py --days 400 --windows 12 --window-days 30 --max-markets 100 --balances 5,50,100 --end-timestamp "$END_TS" --out donchian-benchmark-results
          else
            echo "Unknown cohort: $COHORT" >&2
            exit 2
          fi
      - name: Quantify uncertainty with moving two-window block bootstrap
        run: |
          python paired_bootstrap_audit.py --input donchian-benchmark-results/donchian_benchmark_pairs.csv --metadata donchian-benchmark-results/run_metadata.json --out donchian-benchmark-results/paired_bootstrap_summary.csv --window-out donchian-benchmark-results/paired_bootstrap_window_detail.csv --replicates 10000 --block-length 2 --seed 20261029
          python two_way_bootstrap_audit.py --input donchian-benchmark-results/donchian_benchmark_pairs.csv --metadata donchian-benchmark-results/run_metadata.json --out donchian-benchmark-results/paired_two_way_bootstrap_summary.csv --market-out donchian-benchmark-results/paired_leave_one_market_out.csv --replicates 10000 --block-length 2 --seed 20261030
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighter-donchian-benchmark-pairs
          path: donchian-benchmark-results/
          if-no-files-found: warn
          retention-days: 30
