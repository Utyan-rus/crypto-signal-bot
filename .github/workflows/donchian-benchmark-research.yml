name: Paired Donchian benchmark research

on:
  pull_request:
    paths:
      - "donchian_benchmark_research.py"
      - "funding_aware_research.py"
      - "hourly_candidate_research.py"
      - "tests/test_donchian_benchmark_research.py"
      - ".github/workflows/donchian-benchmark-research.yml"
  workflow_dispatch:
    inputs:
      max_markets:
        description: "Markets to test"
        required: true
        default: "10"
        type: choice
        options: ["5", "10", "25"]

permissions:
  contents: read

jobs:
  paired-donchian-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile and unit tests
        run: |
          python -m compileall -q donchian_benchmark_research.py funding_aware_research.py hourly_candidate_research.py
          python -m unittest discover -s tests -p 'test_donchian_benchmark_research.py' -v
      - name: Run paired 365-day Donchian vs buy-and-hold research
        run: |
          END_TS=$(date -u +%s)
          python donchian_benchmark_research.py --days 365 --windows 8 --window-days 30 --max-markets "${{ inputs.max_markets || '10' }}" --balances 5,50,100 --end-timestamp "$END_TS" --out donchian-benchmark-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighter-donchian-benchmark-pairs
          path: donchian-benchmark-results/
          if-no-files-found: warn
          retention-days: 30
