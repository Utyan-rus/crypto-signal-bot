name: Independent hourly paper-forward collector

on:
  # GitHub scheduled workflows run only from the default branch.
  # This research-branch schedule remains dormant until explicitly merged to main.
  schedule:
    - cron: "17 * * * *"
  push:
    branches: ["research/robust-backtest-audit"]
    paths:
      - "paper_forward_collector.py"
      - "tests/test_paper_forward_collector.py"
      - ".github/workflows/paper-forward-collector.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-forward-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/robust-backtest-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Run collector tests
        run: python -m unittest discover -s tests -p 'test_paper_forward_collector.py' -v
      - name: Collect newly closed hourly bars
        run: python paper_forward_collector.py --output-dir paper-forward-data --state paper-forward-data/state.json
      - name: Upload immutable run snapshot
        uses: actions/upload-artifact@v4
        with:
          name: paper-forward-${{ github.run_id }}
          path: |
            paper-forward-data/summary.json
            paper-forward-data/events.jsonl
          if-no-files-found: error
          retention-days: 90
      - name: Persist append-only journal and checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-forward-data/state.json paper-forward-data/events.jsonl
          if git diff --cached --quiet; then
            echo "No new closed hourly bars; nothing to persist."
          else
            git commit -m "Record paper-forward collector checkpoint"
            git push origin HEAD:research/robust-backtest-audit
          fi
